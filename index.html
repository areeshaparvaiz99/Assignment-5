<!DOCTYPE html>
<html>
<head>
    <title>Areesha's Website - Assignment 5</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Segoe UI', Arial; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .container {
            background: white;
            padding: 50px 80px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand {
            font-size: 18px;
            color: #764ba2;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        h1 { 
            color: #333; 
            font-size: 40px;
            margin-bottom: 40px;
        }
        a { 
            display: inline-block; 
            padding: 18px 40px; 
            margin: 15px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        a:hover { 
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }
        footer {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">Areesha's Website</div>
        <h1>Assignment 5</h1>
        <a href="ludoBoard.html">Ludo Board</a>
